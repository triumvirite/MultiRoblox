name: build & release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test MultiRoblox.sln -c Debug --nologo

      - name: Publish single-file exe
        run: dotnet publish src/MultiRoblox.App/MultiRoblox.App.csproj -c Release --nologo

      - name: Read version from the project
        id: ver
        shell: pwsh
        run: |
          $csproj = Get-Content src/MultiRoblox.App/MultiRoblox.App.csproj -Raw
          if ($csproj -notmatch '<Version>([^<]+)</Version>') { throw "no <Version> in csproj" }
          $v = $Matches[1].Trim()
          "tag=v$v" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "version = v$v"

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $pub = "src/MultiRoblox.App/bin/Release/net8.0-windows/win-x64/publish"
          if (-not (Test-Path "$pub/MultiRoblox.exe")) { throw "MultiRoblox.exe not produced" }
          $zip = "MultiRoblox-${{ steps.ver.outputs.tag }}-win-x64.zip"
          Compress-Archive -Path "$pub/MultiRoblox.exe", "README.md" -DestinationPath $zip -Force
          "zip=$zip" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Point the version tag at this commit
        run: |
          git tag -f "${{ steps.ver.outputs.tag }}"
          git push -f origin "${{ steps.ver.outputs.tag }}"

      - name: Create or refresh the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $zip = "${{ steps.pkg.outputs.zip }}"
          $sha = "${{ github.sha }}".Substring(0,7)
          $title = "MultiRoblox $tag"
          $notes = "Built from commit $sha on $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC.`n`nUnzip and run MultiRoblox.exe - no install, .NET runtime bundled in. Windows 10/11 x64."

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $title --notes $notes --target ${{ github.sha }} --latest --prerelease=false
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title $title --notes $notes --target ${{ github.sha }} --latest
          }
