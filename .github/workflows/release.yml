name: build & release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          # major.minor come from <Version> in the csproj; the patch auto-increments per CI run,
          # so every push publishes a strictly newer version the in-app updater can compare against.
          $csproj = Get-Content src/MultiRoblox.App/MultiRoblox.App.csproj -Raw
          if ($csproj -notmatch '<Version>(\d+)\.(\d+)') { throw "no major.minor <Version> in csproj" }
          $version = "$($Matches[1]).$($Matches[2]).${{ github.run_number }}"
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          "tag=v$version"    | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "version = v$version"

      - name: Test
        run: dotnet test MultiRoblox.sln -c Debug --nologo

      - name: Publish single-file exe
        run: >
          dotnet publish src/MultiRoblox.App/MultiRoblox.App.csproj -c Release --nologo
          -p:Version=${{ steps.ver.outputs.version }}
          -p:FileVersion=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $pub = "src/MultiRoblox.App/bin/Release/net8.0-windows/win-x64/publish"
          if (-not (Test-Path "$pub/MultiRoblox.exe")) { throw "MultiRoblox.exe not produced" }
          $tag = "${{ steps.ver.outputs.tag }}"
          $exe = "MultiRoblox.exe"
          $zip = "MultiRoblox-$tag-win-x64.zip"
          Copy-Item "$pub/MultiRoblox.exe" $exe
          Compress-Archive -Path "$pub/MultiRoblox.exe", "README.md" -DestinationPath $zip -Force
          "exe=$exe" | Out-File $env:GITHUB_OUTPUT -Append
          "zip=$zip" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Point the version tag at this commit
        run: |
          git tag -f "${{ steps.ver.outputs.tag }}"
          git push -f origin "${{ steps.ver.outputs.tag }}"

      - name: Create or refresh the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $zip = "${{ steps.pkg.outputs.zip }}"
          $sha = "${{ github.sha }}".Substring(0,7)
          $title = "MultiRoblox $tag"
          $notes = "Built from commit $sha on $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC.`n`nUnzip and run MultiRoblox.exe - no install, .NET runtime bundled in. Windows 10/11 x64."

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $title --notes $notes --target ${{ github.sha }} --latest --prerelease=false
            gh release upload $tag $zip "${{ steps.pkg.outputs.exe }}" --clobber
          } else {
            gh release create $tag $zip "${{ steps.pkg.outputs.exe }}" --title $title --notes $notes --target ${{ github.sha }} --latest
          }
