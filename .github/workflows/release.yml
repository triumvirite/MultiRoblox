name: build & release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          # major.minor come from <Version> in the csproj; the patch auto-increments each push within
          # that minor line (counting existing v<major>.<minor>.* tags), so every push is a strictly
          # newer version the in-app updater can compare against. Bump <Version>'s minor for a new line.
          $csproj = Get-Content src/MultiRoblox.App/MultiRoblox.App.csproj -Raw
          if ($csproj -notmatch '<Version>(\d+)\.(\d+)') { throw "no major.minor <Version> in csproj" }
          $base = "$($Matches[1]).$($Matches[2])"
          git fetch --tags --force --quiet
          # patch = how many v<base>.* tags already exist, so each push in a minor line is +1
          # (e.g. base 1.2, no tags yet -> v1.2.0; next push -> v1.2.1)
          $patch = (git tag -l "v$base.*" | Measure-Object).Count
          $version = "$base.$patch"
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          "tag=v$version"    | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "version = v$version"

      - name: Build release notes from commits since the last release
        id: notes
        shell: pwsh
        run: |
          $prev = (git tag -l "v*" --sort=-v:refname | Select-Object -First 1)
          $range = if ($prev) { "$prev..HEAD" } else { "HEAD" }
          $subjects = git log $range --no-merges --pretty=format:"%s"

          $bullets = foreach ($s in $subjects) {
            if ([string]::IsNullOrWhiteSpace($s)) { continue }
            # split one commit into its listed changes: on ". " and on ", " after a "prefix:"
            $s = $s -replace '^(Add|Fix|CI|UI|Update)[^:]*:\s*', ''
            foreach ($part in ($s -split '(?:\.\s+|;\s+|,\s+)')) {
              $p = $part.Trim().TrimEnd('.')
              if ($p.Length -ge 4) { "- " + ($p.Substring(0,1).ToUpper() + $p.Substring(1)) }
            }
          }
          $bullets = $bullets | Select-Object -Unique
          if (-not $bullets) { $bullets = @("- Maintenance build") }

          $body = "### What's new`n" + ($bullets -join "`n") +
                  "`n`nDownload ``MultiRoblox.exe`` (or the zip) and run it - no install, .NET bundled. Windows 10/11 x64."
          $body | Out-File notes.md -Encoding utf8
          "file=notes.md" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host $body

      - name: Test
        run: dotnet test MultiRoblox.sln -c Debug --nologo

      - name: Publish single-file exe
        run: >
          dotnet publish src/MultiRoblox.App/MultiRoblox.App.csproj -c Release --nologo
          -p:Version=${{ steps.ver.outputs.version }}
          -p:FileVersion=${{ steps.ver.outputs.version }}
          -p:AssemblyVersion=${{ steps.ver.outputs.version }}

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $pub = "src/MultiRoblox.App/bin/Release/net8.0-windows/win-x64/publish"
          if (-not (Test-Path "$pub/MultiRoblox.exe")) { throw "MultiRoblox.exe not produced" }
          $tag = "${{ steps.ver.outputs.tag }}"
          $exe = "MultiRoblox.exe"
          $zip = "MultiRoblox-$tag-win-x64.zip"
          Copy-Item "$pub/MultiRoblox.exe" $exe
          Compress-Archive -Path "$pub/MultiRoblox.exe", "README.md" -DestinationPath $zip -Force
          "exe=$exe" | Out-File $env:GITHUB_OUTPUT -Append
          "zip=$zip" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Point the version tag at this commit
        run: |
          git tag -f "${{ steps.ver.outputs.tag }}"
          git push -f origin "${{ steps.ver.outputs.tag }}"

      - name: Create or refresh the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $zip = "${{ steps.pkg.outputs.zip }}"
          $title = "MultiRoblox $tag"
          $notesFile = "${{ steps.notes.outputs.file }}"

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $title --notes-file $notesFile --target ${{ github.sha }} --latest --prerelease=false
            gh release upload $tag $zip "${{ steps.pkg.outputs.exe }}" --clobber
          } else {
            gh release create $tag $zip "${{ steps.pkg.outputs.exe }}" --title $title --notes-file $notesFile --target ${{ github.sha }} --latest
          }
