name: build & release

on:
  push:
    branches: [main]          # every push to main -> refresh the rolling "latest" release
    tags: ["v*"]              # pushing a version tag -> permanent versioned release
  workflow_dispatch:            # manual "Run workflow" button

permissions:
  contents: write               # needed to create/update releases and move the tag

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test MultiRoblox.sln -c Debug --nologo

      - name: Publish single-file exe
        run: dotnet publish src/MultiRoblox.App/MultiRoblox.App.csproj -c Release --nologo

      - name: Work out the version label
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF -replace 'refs/tags/',''
            $rolling = 'false'
          } else {
            $tag = 'latest'
            $rolling = 'true'
          }
          "tag=$tag"          | Out-File $env:GITHUB_OUTPUT -Append
          "rolling=$rolling"  | Out-File $env:GITHUB_OUTPUT -Append

      - name: Package
        shell: pwsh
        run: |
          $pub = "src/MultiRoblox.App/bin/Release/net8.0-windows/win-x64/publish"
          if (-not (Test-Path "$pub/MultiRoblox.exe")) { throw "MultiRoblox.exe not produced" }
          $zip = "MultiRoblox-${{ steps.ver.outputs.tag }}-win-x64.zip"
          Compress-Archive -Path "$pub/MultiRoblox.exe", "README.md" -DestinationPath $zip -Force
          "zip=$zip" | Out-File $env:GITHUB_OUTPUT -Append
        id: pkg

      - name: Move the rolling tag to this commit
        if: steps.ver.outputs.rolling == 'true'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish / refresh the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $zip = "${{ steps.pkg.outputs.zip }}"
          $sha = "${{ github.sha }}".Substring(0,7)

          if ($tag -eq 'latest') {
            $title = "Latest build"
            $notes = "Automatically built from commit $sha on $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC.`nUnzip and run MultiRoblox.exe - no install, .NET bundled. Windows 10/11 x64."
          } else {
            $title = "MultiRoblox $tag"
            $notes = "Release $tag (commit $sha).`nUnzip and run MultiRoblox.exe - no install, .NET bundled. Windows 10/11 x64."
          }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $title --notes $notes --target ${{ github.sha }} --latest
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title $title --notes $notes --target ${{ github.sha }} --latest
          }
